name: Build & Release ZeroExtract

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest setuptools wheel
          pip install -e .

      - name: Run Unit Tests
        run: pytest tests/unit

      - name: Run E2E Test Suite
        run: python tests/run_e2e_tests.py --tier all

  build-windows:
    name: Build Windows Standalone Executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller setuptools wheel
          pip install -e .

      - name: Build zeroextract.exe
        run: |
          pyinstaller --onefile --icon zeroextract.ico --name zeroextract --clean run_zeroextract.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeroextract-windows-x64
          path: dist/zeroextract.exe

  build-pypi:
    name: Build PyPI Package (Wheel & sdist)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distribution packages
        run: python -m build

      - name: Upload PyPI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroextract-pypi-dist
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-pypi]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: zeroextract-windows-x64
          path: dist-release/

      - name: Download PyPI packages
        uses: actions/download-artifact@v4
        with:
          name: zeroextract-pypi-dist
          path: dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
